  <div id="root"></div>

  <!-- Slow-load fallback (JS on, but slow connection): if the app hasn't booted
       within 3s, show a tiny critical hero + contact so the page is never blank.
       main.tsx sets window.__appReady on boot and removes the .slow class. -->
  <style>
    /* Fallback-chrome tokens, kept in sync with --paper/--ink/--accent in
       specimen.css but declared here so they exist BEFORE that stylesheet
       loads (the whole point of the slow-load path). Carbon overrides below. */
    :root {
      --lite-bg: #fbfbfc;
      --lite-ink: #0b0d13;
      --lite-mute: #777a82;
      --lite-accent: #194fe3;
      --lite-rule: rgba(11, 13, 19, 0.16);
    }
    html[data-theme="carbon"] {
      --lite-bg: #101014;
      --lite-ink: #e6e8ec;
      --lite-mute: #71747b;
      --lite-accent: #6097ff;
      --lite-rule: rgba(230, 232, 236, 0.18);
    }
    html { background: var(--lite-bg); color: var(--lite-ink); }

    #root { transition: opacity 0.5s ease; opacity: 1; }
    html.slow #root { opacity: 0 !important; pointer-events: none; }

    #lite {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html.slow #lite { opacity: 1; pointer-events: auto; }

    .lite-inner { max-width: 640px; width: 100%; }
    .lite-inner .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--lite-mute); margin-bottom: 24px;
    }
    .lite-inner h1 {
      font-size: clamp(48px, 10vw, 88px); line-height: 0.95; letter-spacing: -0.04em;
      margin: 0; font-weight: 500;
    }
    .lite-inner h1 em { font-style: italic; color: var(--lite-accent); font-weight: 400; }

    .lite-inner p {
      font-size: 18px; color: var(--lite-mute); margin: 24px 0 32px; max-width: 48ch; line-height: 1.5;
    }
    .lite-links { display: flex; gap: 24px; flex-wrap: wrap; }
    .lite-links a {
      font-size: 15px; color: var(--lite-ink); text-decoration: none;
      border-bottom: 1px solid var(--lite-rule); padding-bottom: 2px; transition: border-color 0.2s;
    }
    .lite-links a:hover { border-bottom-color: var(--lite-accent); }
  </style>
