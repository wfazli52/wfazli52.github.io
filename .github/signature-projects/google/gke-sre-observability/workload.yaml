apiVersion: v1
kind: Namespace
metadata:
  name: abdul-sre-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: abdul-sre-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: abdul-sre-lab
spec:
  selector:
    app: demo-web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
