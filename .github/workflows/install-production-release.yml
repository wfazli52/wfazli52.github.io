name: Install complete production portfolio

on:
  push:
    branches:
      - main
    paths:
      - ".production-release/**"
      - ".github/workflows/install-production-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-complete-production-portfolio
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and verify production release
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .production-release -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 7
          cat .production-release/part-*.b64 | base64 --decode > production-text-overlay.tar.xz
          echo "561365347ea0e21610fefe4802e9b507a9729305d5f0ad1757a981231c6e471a  production-text-overlay.tar.xz" | sha256sum --check --strict

      - name: Preserve verified Proof Mode files
        shell: bash
        run: |
          set -euo pipefail
          echo "7aebbd14cece8c0f49152fd7c27545b8b8da3929257867ab285d481b3f638046  proof-data.js" | sha256sum --check --strict
          echo "e71be7b096ebabef83c3796de224f6a542920af7ac91885090008b35ad4b7131  proof-mode.js" | sha256sum --check --strict
          echo "7783af4e01830f9241a0e31341b25176ee9ec06a0d1d9939a5e9c61c77661e68  proof-mode.css" | sha256sum --check --strict
          echo "9cf76d16f25ea4484cb5026c7d27ef6eee7308906e3c0302b3ed91ee57ec3a6c  PROOF_MODE.md" | sha256sum --check --strict

      - name: Install production portfolio
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf production-text-overlay.tar.xz -C .
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 scripts/generate-assets.py

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          echo "7aebbd14cece8c0f49152fd7c27545b8b8da3929257867ab285d481b3f638046  proof-data.js" | sha256sum --check --strict
          echo "e71be7b096ebabef83c3796de224f6a542920af7ac91885090008b35ad4b7131  proof-mode.js" | sha256sum --check --strict
          echo "7783af4e01830f9241a0e31341b25176ee9ec06a0d1d9939a5e9c61c77661e68  proof-mode.css" | sha256sum --check --strict
          echo "9cf76d16f25ea4484cb5026c7d27ef6eee7308906e3c0302b3ed91ee57ec3a6c  PROOF_MODE.md" | sha256sum --check --strict
          node scripts/validate-site.mjs
          node --check script.js
          node --check portfolio-data.js
          node --check portfolio-suite.js
          node --check case-study.js
          node --check sw.js
          node --check command-center.js
          node --check fx.js
          python3 -m py_compile scripts/generate-assets.py
          test -s assets/icon-32.png
          test -s assets/icon-192.png
          test -s assets/icon-512.png
          test -s assets/apple-touch-icon.png
          test -s assets/maskable-icon-512.png
          test -s assets/social-card.png
          test -s assets/screenshot-wide.webp
          test -s assets/screenshot-mobile.webp

      - name: Remove temporary installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -f production-text-overlay.tar.xz
          rm -rf .production-release
          rm -rf .ultimate-package
          rm -rf .ultimate-suite
          rm -f .github/workflows/install-production-release.yml

      - name: Commit production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Launch complete production portfolio suite"
          git push

# Triggered through a same-repository merge so the main-branch push event is explicit.
