name: Capture production archive diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/diagnose-production-installer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub's merged PR snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture exact archive diagnostics
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          report=.github/production-diagnostic-report.txt
          mkdir -p .github
          : > "$report"
          {
            echo "Production archive diagnostic"
            echo "============================="
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "checked_out_commit=$(git rev-parse HEAD)"
            echo "head_branch=${HEAD_BRANCH}"
            echo
            echo "[staging directory]"
            find .production-release -maxdepth 1 -type f -printf '%f %s bytes\n' 2>&1 | sort
            echo
            chunk_count="$(find .production-release -maxdepth 1 -name 'part-*.b64' 2>/dev/null | wc -l)"
            echo "chunk_count=${chunk_count}"
            cat .production-release/part-*.b64 > /tmp/combined-release.b64 2>/tmp/cat-error.txt
            cat_status=$?
            echo "cat_status=${cat_status}"
            echo "combined_base64_bytes=$(wc -c < /tmp/combined-release.b64 2>/dev/null)"
            echo "cat_stderr=$(tr '\n' ' ' < /tmp/cat-error.txt 2>/dev/null)"
            base64 --decode --ignore-garbage /tmp/combined-release.b64 > /tmp/production-text-overlay.tar.xz 2>/tmp/base64-error.txt
            decode_status=$?
            echo "gnu_decode_status=${decode_status}"
            echo "gnu_decode_stderr=$(tr '\n' ' ' < /tmp/base64-error.txt 2>/dev/null)"
            echo "archive_bytes=$(wc -c < /tmp/production-text-overlay.tar.xz 2>/dev/null)"
            echo "archive_sha256=$(sha256sum /tmp/production-text-overlay.tar.xz 2>/dev/null | awk '{print $1}')"
            tar -tJf /tmp/production-text-overlay.tar.xz >/tmp/tar-list.txt 2>/tmp/tar-error.txt
            tar_status=$?
            echo "tar_status=${tar_status}"
            echo "tar_stderr=$(tr '\n' ' ' < /tmp/tar-error.txt 2>/dev/null)"
            echo "tar_entry_count=$(wc -l < /tmp/tar-list.txt 2>/dev/null)"
            echo
            echo "[Python decoder]"
            python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, tarfile
          source = Path('/tmp/combined-release.b64').read_bytes()
          filtered = bytes(ch for ch in source if ch in b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          print(f'raw_bytes={len(source)}')
          print(f'filtered_bytes={len(filtered)}')
          try:
              decoded = base64.b64decode(filtered, validate=False)
              Path('/tmp/python-production-text-overlay.tar.xz').write_bytes(decoded)
              print(f'decoded_bytes={len(decoded)}')
              print(f'decoded_sha256={hashlib.sha256(decoded).hexdigest()}')
              try:
                  with tarfile.open('/tmp/python-production-text-overlay.tar.xz', mode='r:xz') as archive:
                      members = archive.getmembers()
                  print(f'tar_members={len(members)}')
                  print('python_tar_status=success')
              except Exception as exc:
                  print(f'python_tar_status=failure: {type(exc).__name__}: {exc}')
          except Exception as exc:
              print(f'python_decode_status=failure: {type(exc).__name__}: {exc}')
          PY
            echo
            echo "[first archive entries]"
            head -30 /tmp/tar-list.txt 2>/dev/null
          } >> "$report" 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          git commit -m "Record production archive diagnostic results" || true
          git push origin "HEAD:${HEAD_BRANCH}"
