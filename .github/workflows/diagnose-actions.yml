name: Install production release through pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: install-production-through-pr
  cancel-in-progress: false

jobs:
  install:
    if: github.head_ref == 'agent/diagnose-production-installer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub's merged PR snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up isolated Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble and test the production archive
        shell: bash
        run: |
          set -euo pipefail
          chunk_count="$(find .production-release -maxdepth 1 -name 'part-*.b64' | wc -l)"
          echo "chunk_count=${chunk_count}"
          test "${chunk_count}" -eq 7
          cat .production-release/part-*.b64 | base64 --decode --ignore-garbage > production-text-overlay.tar.xz
          echo "archive_sha256=$(sha256sum production-text-overlay.tar.xz | awk '{print $1}')"
          test -s production-text-overlay.tar.xz
          tar -tJf production-text-overlay.tar.xz >/dev/null

      - name: Confirm the preserved Proof Mode files
        shell: bash
        run: |
          set -euo pipefail
          test -s proof-data.js
          test -s proof-mode.js
          test -s proof-mode.css
          test -s PROOF_MODE.md
          sha256sum proof-data.js proof-mode.js proof-mode.css PROOF_MODE.md
          node --check proof-data.js
          node --check proof-mode.js

      - name: Build the complete production portfolio
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf production-text-overlay.tar.xz -C .
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/generate-assets.py

      - name: Validate every production component
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-site.mjs
          node --check script.js
          node --check portfolio-data.js
          node --check portfolio-suite.js
          node --check case-study.js
          node --check sw.js
          node --check command-center.js
          node --check fx.js
          node --check proof-data.js
          node --check proof-mode.js
          python -m py_compile scripts/generate-assets.py
          test -s proof-mode.css
          test -s PROOF_MODE.md
          test -s assets/icon-32.png
          test -s assets/icon-192.png
          test -s assets/icon-512.png
          test -s assets/apple-touch-icon.png
          test -s assets/maskable-icon-512.png
          test -s assets/social-card.png
          test -s assets/screenshot-wide.webp
          test -s assets/screenshot-mobile.webp

      - name: Remove temporary deployment machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f production-text-overlay.tar.xz
          rm -rf .production-release
          rm -rf .ultimate-package
          rm -rf .ultimate-suite
          rm -f .github/diagnostic-trigger.txt
          rm -f .github/workflows/install-production-release.yml
          rm -f .github/workflows/diagnose-actions.yml

      - name: Commit the validated production release to the PR branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Launch complete production portfolio suite"
          git push origin "HEAD:${HEAD_BRANCH}"
