name: Unpack and publish portfolio

on:
  push:
    branches:
      - main
    paths:
      - "data-center-portfolio-github-ready.zip"
      - ".github/workflows/unpack-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack website files
        shell: bash
        run: |
          set -euo pipefail
          test -f data-center-portfolio-github-ready.zip
          unzip -o data-center-portfolio-github-ready.zip -d .
          rm data-center-portfolio-github-ready.zip

      - name: Commit unpacked website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Publish portfolio website"
          git push
