name: Apply portfolio focus themes

on:
  push:
    branches:
      - main
    paths:
      - ".github/overlay/focus-themes.css"
      - ".github/overlay/focus-themes.js"
      - ".github/overlay/focus-3d.css"
      - ".github/overlay/future-loader-v8.js"
      - ".github/workflows/apply-focus-themes.yml"
      - "index.html"
      - "future-loader.js"
      - "hero-3d.js"
  workflow_run:
    workflows:
      - Build permitted cinematic specimen
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-focus-themes
  cancel-in-progress: true

jobs:
  apply-focus-themes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out latest live portfolio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore premium focus identity layer
        shell: bash
        run: |
          set -euo pipefail
          cp .github/overlay/focus-themes.css focus-themes.css
          cp .github/overlay/focus-themes.js focus-themes.js
          cp .github/overlay/focus-3d.css focus-3d.css
          cp .github/overlay/future-loader-v8.js future-loader.js
          node --check focus-themes.js
          node --check future-loader.js

      - name: Validate focus identity release
        shell: bash
        run: |
          set -euo pipefail
          test -s focus-themes.css
          test -s focus-themes.js
          test -s focus-3d.css
          test -s future-loader.js
          grep -q 'Google Focus' focus-themes.js
          grep -q 'Amazon Focus' focus-themes.js
          grep -q 'Microsoft Focus' focus-themes.js
          grep -q 'Original' focus-themes.js
          grep -q '/focus-themes.css?v=8' future-loader.js
          grep -q '/focus-3d.css?v=8' future-loader.js
          grep -q '/focus-themes.js?v=8' future-loader.js

      - name: Commit focus identity layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add focus-themes.css focus-themes.js focus-3d.css future-loader.js
          if git diff --cached --quiet; then
            echo "Focus identity layer is already current."
            exit 0
          fi
          git commit -m "Restore premium portfolio focus themes"
          git push origin HEAD:main
