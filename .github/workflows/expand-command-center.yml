name: Expand command center source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/expand-command-center.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand compressed command center
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          path = Path("command-center.js")
          loader = path.read_text(encoding="utf-8")
          chunks = [match for match in re.findall(r"'([A-Za-z0-9+/=]+)'", loader) if len(match) > 1000]
          if len(chunks) != 2:
              raise SystemExit(f"Expected two payload chunks, found {len(chunks)}")
          source = gzip.decompress(base64.b64decode("".join(chunks)))
          path.write_bytes(source)
          PY

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/expand-command-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add command-center.js .github/workflows/expand-command-center.yml
          git commit -m "Expand interactive command center source"
          git push
