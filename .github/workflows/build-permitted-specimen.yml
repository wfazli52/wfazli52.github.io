name: Build permitted cinematic specimen

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-permitted-specimen.yml"
      - ".github/overlay/**"
      - "scripts/prepare-permitted-specimen.py"
      - "scripts/personalize-abdul.py"
      - "scripts/add-network-engineering-plan.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: permitted-cinematic-specimen
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out latest portfolio main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out permitted reference architecture
        uses: actions/checkout@v4
        with:
          repository: imranhwafa/Imranwafacom
          ref: main
          path: _reference
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _reference/app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Adapt personal content into honest placeholders
        env:
          REFERENCE_APP: _reference/app
        run: python scripts/prepare-permitted-specimen.py

      - name: Personalize Abdul and generate data-center lab plans
        env:
          REFERENCE_APP: _reference/app
        run: python scripts/personalize-abdul.py

      - name: Add planned network engineering degree and certification roadmap
        env:
          REFERENCE_APP: _reference/app
        run: python scripts/add-network-engineering-plan.py

      - name: Add futuristic hero and v9 focus worlds
        shell: bash
        run: |
          set -euo pipefail
          git show b07c71435cac80b01443a4407647589650bb21fa:future-ui.css > _reference/app/public/future-ui.css
          cp .github/overlay/future-ui.js _reference/app/public/future-ui.js
          git show 7c3adb82ce402c83f9729b23756dde88fd72336f:hero-3d.js > _reference/app/public/hero-3d.js
          cp .github/overlay/future-polish.css _reference/app/public/future-polish.css
          cp .github/overlay/future-polish.js _reference/app/public/future-polish.js
          cp .github/overlay/future-quality.js _reference/app/public/future-quality.js

          cp .github/overlay/focus-themes.css _reference/app/public/focus-themes.css
          cp .github/overlay/focus-themes.js _reference/app/public/focus-themes.js
          cp .github/overlay/focus-3d.css _reference/app/public/focus-3d.css
          cp .github/overlay/focus-worlds.css _reference/app/public/focus-worlds.css
          cp .github/overlay/focus-effects.js _reference/app/public/focus-effects.js
          cp .github/overlay/focus-chrome.css _reference/app/public/focus-chrome.css
          cp .github/overlay/focus-chrome.js _reference/app/public/focus-chrome.js
          cp .github/overlay/focus-refine.css _reference/app/public/focus-refine.css
          cp .github/overlay/future-loader-v8.js _reference/app/public/future-loader.js

          python - <<'PY'
          from pathlib import Path
          path = Path('_reference/app/public/hero-3d.js')
          text = path.read_text(encoding='utf-8')
          old = "renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.25 : 1.75));"
          new = "renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.25 : 1.75, window.__FUTURE_DPR_CAP__ || Infinity));"
          if old not in text:
              raise SystemExit('hero DPR hook target not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          node --check _reference/app/public/future-ui.js
          node --check _reference/app/public/hero-3d.js
          node --check _reference/app/public/future-polish.js
          node --check _reference/app/public/future-quality.js
          node --check _reference/app/public/focus-themes.js
          node --check _reference/app/public/focus-effects.js
          node --check _reference/app/public/focus-chrome.js
          node --check _reference/app/public/future-loader.js

          python - <<'PY'
          from pathlib import Path
          path = Path('_reference/app/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('</head>', '  <link rel="stylesheet" href="/future-ui.css?v=7" />\n  <link rel="stylesheet" href="/future-polish.css?v=7" />\n  <script defer src="/future-loader.js?v=9"></script>\n</head>')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install exact application dependencies
        working-directory: _reference/app
        run: npm ci --no-audit --no-fund

      - name: Run showcase choreography tests
        working-directory: _reference/app
        run: npm run test:showcase

      - name: Build the production React and Three.js site
        working-directory: _reference/app
        run: npm run build

      - name: Finalize production shell and carbon theme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('_reference/app/dist/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<html lang="en" data-theme="paper">', '<html lang="en" data-theme="carbon">')
          text = text.replace("if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'carbon';", "if (!t) t = 'carbon';")
          text = text.replace('<meta name="theme-color" content="#fbfbfc" />', '<meta name="theme-color" content="#101014" />')
          text = text.replace('WGU · Associate in Cybersecurity · In progress', 'Northern Virginia Community College · Associate in Cybersecurity')
          text = text.replace('[ADD YOUR 3–5 SENTENCE INTRODUCTION.] This portfolio is designed for data center, deployment, NOC, and network-support opportunities.', 'Cybersecurity education at Northern Virginia Community College, a planned WGU network-engineering bachelor path, and evidence-first labs focused on data center, networking, Linux, hardware, and infrastructure operations.')
          text = text.replace('Enterprise VLAN Lab · Linux Operations Lab · Rack & Cabling Operations · [YOUR NEXT PROJECT]', 'Enterprise VLAN & Routing · NetBox DCIM/IPAM · BMC/IPMI Telemetry · SMART Storage Health · Bare-Metal Provisioning · Linux Operations · Rack & Cabling')
          text = text.replace('Northern Virginia Community College · Associate in Cybersecurity · In progress', 'Northern Virginia Community College · Associate in Cybersecurity<br>Western Governors University · B.S. Network Engineering · Cisco track · Planned next')
          text = text.replace('Northern Virginia Community College · Associate in Cybersecurity</p><h2>Contact</h2>', 'Northern Virginia Community College · Associate in Cybersecurity<br>Western Governors University · B.S. Network Engineering · Cisco track · Planned next</p><h2>Planned certifications</h2><p>CompTIA A+ · LPI Linux Essentials · ITIL 4 Foundation · Cisco CCNA · Cisco Certified Cybersecurity Associate · Cisco DevNet Associate / CCNA Automation · CompTIA Cloud+ · WGU Certified Network Technician Badge</p><h2>Contact</h2>')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate production output
        shell: bash
        run: |
          set -euo pipefail
          test -s _reference/app/dist/index.html
          test -d _reference/app/dist/assets
          test "$(find _reference/app/dist/assets -type f -name '*.js' | wc -l)" -ge 3
          test "$(find _reference/app/dist/assets -type f -name '*.css' | wc -l)" -ge 1
          test -s _reference/app/dist/future-ui.css
          test -s _reference/app/dist/future-ui.js
          test -s _reference/app/dist/hero-3d.js
          test -s _reference/app/dist/future-polish.css
          test -s _reference/app/dist/future-polish.js
          test -s _reference/app/dist/future-quality.js
          test -s _reference/app/dist/future-loader.js
          test -s _reference/app/dist/focus-themes.css
          test -s _reference/app/dist/focus-themes.js
          test -s _reference/app/dist/focus-3d.css
          test -s _reference/app/dist/focus-worlds.css
          test -s _reference/app/dist/focus-effects.js
          test -s _reference/app/dist/focus-chrome.css
          test -s _reference/app/dist/focus-chrome.js
          test -s _reference/app/dist/focus-refine.css
          test -s _reference/app/dist/labs/netbox-dcim.html
          test -s _reference/app/dist/labs/ipmi-telemetry.html
          test -s _reference/app/dist/labs/storage-health.html
          test -s _reference/app/dist/labs/bare-metal-lifecycle.html
          grep -q "Specimen Sheet" _reference/app/dist/index.html
          grep -q "Abdul Fazli" _reference/app/dist/index.html
          grep -R -I -q "Northern Virginia Community College" _reference/app/dist
          grep -R -I -q "B.S. Network Engineering" _reference/app/dist
          grep -R -I -q "CompTIA A+" _reference/app/dist
          grep -R -I -q "Cisco Certified Network Associate" _reference/app/dist
          grep -R -I -q "Cisco DevNet Associate" _reference/app/dist
          grep -R -I -q "CompTIA Cloud+" _reference/app/dist
          grep -R -I -q "NetBox DCIM & IPAM Source of Truth" _reference/app/dist
          grep -q 'data-theme="carbon"' _reference/app/dist/index.html
          grep -q 'future-loader.js?v=9' _reference/app/dist/index.html
          grep -q '/focus-worlds.css?v=9' _reference/app/dist/future-loader.js
          grep -q '/focus-effects.js?v=9' _reference/app/dist/future-loader.js
          grep -q '/focus-chrome.css?v=9' _reference/app/dist/future-loader.js
          grep -q '/focus-refine.css?v=9' _reference/app/dist/future-loader.js
          grep -q 'Google Focus' _reference/app/dist/focus-themes.js
          grep -q 'amazon-rack-tower' _reference/app/dist/focus-worlds.css
          grep -q 'ms-command-shell' _reference/app/dist/focus-chrome.css
          ! grep -R -I -n -E "contact@imranwafa\.com|703.?364.?9357|Petromax LLC|Instawire LLC|Mgtwell LLC" _reference/app/dist

      - name: Replace the live GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/permitted-specimen-site
          mkdir -p /tmp/permitted-specimen-site
          cp -a _reference/app/dist/. /tmp/permitted-specimen-site/
          cp /tmp/permitted-specimen-site/index.html /tmp/permitted-specimen-site/404.html
          touch /tmp/permitted-specimen-site/.nojekyll

          cp scripts/prepare-permitted-specimen.py /tmp/prepare-permitted-specimen.py
          cp scripts/personalize-abdul.py /tmp/personalize-abdul.py
          cp scripts/add-network-engineering-plan.py /tmp/add-network-engineering-plan.py
          rm -rf _reference
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p scripts
          cp /tmp/prepare-permitted-specimen.py scripts/prepare-permitted-specimen.py
          cp /tmp/personalize-abdul.py scripts/personalize-abdul.py
          cp /tmp/add-network-engineering-plan.py scripts/add-network-engineering-plan.py
          cp -a /tmp/permitted-specimen-site/. .

      - name: Commit compiled v9 portfolio on top of latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The compiled site already matches the permitted source."
            exit 0
          fi

          tree_sha="$(git write-tree)"
          git fetch origin main
          parent_sha="$(git rev-parse origin/main)"
          commit_sha="$(printf '%s\n' 'Launch Abdul Fazli v9 focus-world portfolio' | git commit-tree "$tree_sha" -p "$parent_sha")"
          git push origin "$commit_sha:main"